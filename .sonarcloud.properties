# SonarQube Cloud Automatic Analysis configuration.
#
# NOTE: automatic analysis reads THIS file. A sonar-project.properties file is
# ignored unless automatic analysis is turned off in favour of a CI-based scan.

# The published SDK is the pure-Dart code under lib/. Everything under example/
# is a QA demo app (Flutter / Gradle / Xcode scaffolding) that is never shipped
# to pub.dev, so it is not analysed.
#
# Excluding example/ also silences "Dependency versions are not predictable if
# the lock file (gradle.lockfile or gradle/verification-metadata.xml) is
# missing" on example/android: Gradle dependency locking cannot be kept green
# there because the Flutter Gradle plugin injects io.flutter:flutter_embedding_*
# coordinates derived from the Flutter SDK revision used by the build.
#
# The root pubspec.yaml is excluded for the pubspec.lock variant of that same
# rule. This package is a published library, and per dart.dev a library package
# must NOT commit pubspec.lock -- regenerating it on each run is what tests the
# SDK against the latest dependency versions its consumers will resolve.
# (example/ is an application package, so example/pubspec.lock IS committed.)
sonar.exclusions=example/**,build/**,tool/**,pubspec.yaml,**/*.g.dart,**/*.freezed.dart,**/*.mocks.dart

sonar.cpd.exclusions=example/**
