# SonarQube Cloud Automatic Analysis configuration.
#
# NOTE: automatic analysis reads THIS file. A sonar-project.properties file is
# ignored unless automatic analysis is turned off in favour of a CI-based scan.
#
# The published SDK is the pure-Dart code under lib/. Everything under example/
# is a QA demo app (Flutter / Gradle / Xcode scaffolding) that is never shipped
# to pub.dev, so it is not analysed.
#
# This also silences "Dependency versions are not predictable if the lock file
# (gradle.lockfile or gradle/verification-metadata.xml) is missing" on
# example/android: Gradle dependency locking cannot be kept green there because
# the Flutter Gradle plugin injects io.flutter:flutter_embedding_* coordinates
# derived from the Flutter SDK revision used by the build.
sonar.exclusions=example/**,build/**,tool/**,**/*.g.dart,**/*.freezed.dart,**/*.mocks.dart

sonar.cpd.exclusions=example/**
